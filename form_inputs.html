<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="author" content="Dave Gray">
        <meta name="description" content="This page contains all the things I am learning how to create as I learn HTML.">
        <title>My first web page</title>
        <link rel="icon" href="html5.png" type="image/x-icon">
        <link rel="stylesheet" href="main.css" type="text/css">
    </head>

    <body>
        <h1>Forms and Input </h1>
        <header>
                <nav aria-label="primary-navigation">
                <ul>
                    <li>
                        <a href="#contact">contact me</a>
                    </li>
                </ul> 
                </nav>
                <article id="contact">
                    <h2>Contact me</h2>
                    <p>i'd really like to hear from you..!</p>

                    <form action="https://httpbin.org/get" method="get">
                        <fieldset>
                            <legend>Personal Info</legend>
                            <p>
                                <label for="firstname">First Name:</label>
                                <input type="text" name="firstname" id="firstname" placeholder="tanu" autocomplete="on" required>
                            </p>
                            <p>
                                <label for="lastname">Last Name:</label>
                                <input type="text" name="lastname" id="lastname" placeholder="rawat" autocomplete="on" required>
                            </p>
                            <p>
                                <label for="password">Password:</label>
                                <input type="password" name="password" id="password" placeholder="your secret" autocomplete="on" required>
                            </p>
                            <p>
                                <label for="phone">Phone:</label>
                                <input type="tel" name="phone" id="phone" placeholder="5555555555" pattern="[0-9]{3}[0-9]{3}[0-9]{4}" required >
                            </p>
                            <p>
                                <label for="decade">Favorite Decade:</label>
                                <input type="number" name="decade" id="decade" min="2000" max="2026" step="1" value="2006">
                            </p>
                            <!-- <p>
                                <label for="coffee">Favorite coffee:</label>
                                <select name="coffee" id="coffee">
                                    <optgroup label="coffees">
                                        <option value="regular coffee">regular coffee</option>
                                        <option value="iced coffee">iced coffee</option>
                                    </optgroup>
                                    <optgroup label="espresso drinks">
                                        <option value="latte" selected>latte</option>
                                        <option value="americano">americano</option>
                                    </optgroup>
                                    <option value="other">other</option>
                                </select>
                            </p> -->

                            <p>
                                <label for="coffee">Favorite coffee:</label>
                                <input type="text" name="coffee" id="coffee" list="coffee-list">
                                <datalist id="coffee-list">
                                    <option value="coffee">
                                    <option value="latte">
                                    <option value="espresso">
                                    <option value="cortado">
                                    <option value="americano">
                                    <option value="other">
                                </datalist>
                            </p>
                        </fieldset>
                        <br>
                        <fieldset>
                            <legend>What is your favorite food?</legend>
                            <p>
                                <input type="radio" name="food" id="pav_bhaji" value="pav_bhaji">
                                <label for="pav_bhaji">Pav_bhaji</label>
                            </p>
                            <p>
                                <input type="radio" name="food" id="pasta" value="pasta">
                                <label for="pasta">Pasta</label>
                            </p>
                            <p>
                                <input type="radio" name="food" id="samosa" value="samosa">
                                <label for="samosa">Samosa</label>
                            </p>
                            <p>
                                <input type="radio" name="food" id="momo" value="momo">
                                <label for="momo">Momo</label>
                            </p>
                            <p>
                                <input type="radio" name="food" id="others" value="others">
                                <label for="others">Others</label>
                            </p>
                        </fieldset>
                        <br>
                        <fieldset>
                            <legend>Do you have pet?</legend>
                            <p>
                                <input type="checkbox" name="pets" id="dog" value="dog">
                                <label for="dog">Dog</label>
                            </p>
                            <p>
                                <input type="checkbox" name="pets" id="cat" value="cat">
                                <label for="cat">Cat</label>
                            </p>
                            <p>
                                <input type="checkbox" name="pets" id="bird" value="bird">
                                <label for="bird">Bird</label>
                            </p>
                            <p>
                                <input type="checkbox" name="pets" id="sheep" value="sheep">
                                <label for="sheep">Sheep</label>
                            </p>
                            <p>
                                <input type="checkbox" name="pets" id="other" value="other">
                                <label for="other">Other</label>
                            </p>
                        </fieldset>
                        <br>
                        <fieldset>
                            <legend>Send me note..!</legend>
                            <label for="message">Your message:</label>
                            <br>
                            <textarea name="message" id="message" cols="30" rows="10" placeholder="Type your message here.."></textarea>
                        </fieldset>
                        <br>
                        <button type="submit">Submit</button>
                        <button type="reset">Reset</button>
                    </form>
                </article>
        </header>
        <footer>
            <p>&lt;&lt;&lt; &copy; To learn more about me, <a href="about.html">click here</a> &gt;&gt;&gt;</p>  

            <p>
                <a href="#">back to top</a>
            </p>
       </footer> 
   
    </body>
</html>
